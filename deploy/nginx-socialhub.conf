# SocialHub — Nginx site. Installed by deploy/install-server.sh (__DOMAIN__ and __APP_DIR__ are filled in).
# Listens only on 127.0.0.1: visitors arrive through the Cloudflare Tunnel, never directly,
# which is what makes TRUSTED_PROXIES=* safe.
server {
    listen 127.0.0.1:80 default_server;
    # cloudflared's "localhost" can resolve to IPv6 ::1, so listen there too (still local-only).
    listen [::1]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # Video uploads up to 1 GB.
    client_max_body_size 1G;
    client_body_timeout 300s;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # robots.txt is generated by the app (it lists the sitemap), so pass it to Laravel.
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
