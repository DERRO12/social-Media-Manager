; SocialHub background worker (publishing, imports, emails). Installed by deploy/install-server.sh.
; Supervisor restarts it if it ever stops. stopwaitsecs lets a running upload finish during deploys.
[program:socialhub-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --sleep=3 --timeout=3600 --max-time=3600
directory=__APP_DIR__
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3660
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
